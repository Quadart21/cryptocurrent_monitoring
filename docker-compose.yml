services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: gapsnap
      POSTGRES_PASSWORD: gapsnap
      POSTGRES_DB: gapsnap
    volumes:
      - gapsnap_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gapsnap -d gapsnap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gapsnap_pg:
